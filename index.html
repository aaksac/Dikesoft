  <script id="dikesoft-entry-splash-early-lock">
    (function () {
      var MOBILE_QUERY = "(max-width: 768px), (min-width: 768px) and (max-width: 1180px) and (orientation: portrait), (hover: none) and (pointer: coarse)";
      var lockedSplashHeight = 0;

      function isMobileLike() {
        try {
          if (window.matchMedia && window.matchMedia(MOBILE_QUERY).matches) return true;
        } catch (error) {}
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(window.navigator.userAgent || "");
      }

      function syncSplashHeight() {
        try {
          var root = document.documentElement;
          var viewport = window.visualViewport;
          var width = Math.ceil(Math.max(
            window.innerWidth || 0,
            root.clientWidth || 0,
            viewport && viewport.width ? viewport.width : 0
          ));
          var height = Math.ceil(Math.max(
            window.innerHeight || 0,
            root.clientHeight || 0,
            viewport && viewport.height ? viewport.height : 0
          ));
          var isLandscape = width > height && width >= 720;

          if (width > 0) root.style.setProperty("--dikesoft-splash-width", width + "px");
          root.classList.toggle("dikesoft-splash-landscape", isLandscape);
          root.classList.toggle("dikesoft-splash-portrait", !isLandscape);

          if (isLandscape) {
            lockedSplashHeight = height || lockedSplashHeight;
          } else {
            var screenHeight = window.screen && window.screen.height ? window.screen.height : 0;
            var nextHeight = Math.ceil(Math.max(height || 0, screenHeight || 0));
            if (nextHeight > lockedSplashHeight) lockedSplashHeight = nextHeight;
          }

          if (lockedSplashHeight > 0) {
            root.style.setProperty("--dikesoft-splash-height", lockedSplashHeight + "px");
          }
        } catch (error) {}
      }

      try {
        var isMobile = isMobileLike();
        document.documentElement.classList.add(isMobile ? "dikesoft-mobile-boot" : "dikesoft-desktop-boot");
        document.documentElement.classList.add("dikesoft-auth-pending");
        if (isMobile) {
          syncSplashHeight();
          document.documentElement.classList.add("dikesoft-splash-active", "dikesoft-splash-image");
          window.addEventListener("resize", syncSplashHeight, { passive: true });
          window.addEventListener("orientationchange", function () {
            lockedSplashHeight = 0;
            window.setTimeout(syncSplashHeight, 80);
          }, { passive: true });
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", syncSplashHeight, { passive: true });
          }
        }
      } catch (error) {}
    })();
  </script>
